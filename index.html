<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyroxToolHub — The Ultimate Free Web Toolbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2300f5ff'/><stop offset='1' stop-color='%23a855f7'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='68' font-size='52' text-anchor='middle'>⚡</text></svg>">
<style>
:root{--bg:#05060f;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.09);--txt:#eef0ff;--mut:#8b90b8;--cyan:#00f5ff;--violet:#a855f7;--pink:#ff3d8a;--green:#34ffb0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;overflow-x:hidden;min-height:100vh}
.bg-glow{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5}
.bg-glow::before{background:radial-gradient(circle,#00f5ff22,#00f5ff00 60%);top:-20vmax;left:-15vmax;animation:drift 18s ease-in-out infinite}
.bg-glow::after{background:radial-gradient(circle,#a855f722,#a855f700 60%);bottom:-25vmax;right:-15vmax;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4vmax,3vmax)}}
.grid-lines{position:fixed;inset:0;z-index:-1;opacity:.05;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:56px 56px}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 6vw;backdrop-filter:blur(14px);background:rgba(5,6,15,.6);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 24px rgba(0,245,255,.4)}
.logo b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sound-toggle{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--txt);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.hero{text-align:center;padding:60px 6vw 30px}
.badge{display:inline-block;padding:7px 16px;border-radius:999px;background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.25);color:var(--cyan);font-size:13px;font-weight:700;margin-bottom:20px;letter-spacing:.5px;text-transform:uppercase}
.hero h1{font-size:clamp(38px,7vw,70px);font-weight:900;line-height:1.05;letter-spacing:-1px}
.hero h1 .grad{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{color:var(--mut);font-size:clamp(15px,2vw,19px);max-width:640px;margin:20px auto 0}
.search-wrap{max-width:560px;margin:34px auto 0;position:relative}
.search-wrap input{width:100%;padding:16px 20px 16px 54px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--txt);font-size:15px;outline:none;transition:.25s}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,245,255,.12)}
.search-wrap .icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:20px 6vw 80px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.btn4d{position:relative;transform-style:preserve-3d;perspective:900px;transition:transform .12s ease;border:1px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:var(--txt);text-decoration:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.btn4d::before{content:"";position:absolute;inset:0;border-radius:18px;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(0,245,255,.14),transparent 45%);opacity:0;transition:opacity .25s}
.btn4d:hover::before{opacity:1}
.btn4d::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.btn4d:hover::after{transform:scaleX(1)}
.btn4d .ti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;z-index:2;background:linear-gradient(135deg,rgba(0,245,255,.16),rgba(168,85,247,.16));border:1px solid rgba(255,255,255,.12)}
.btn4d .nm{font-weight:700;font-size:14px;z-index:2}
.btn4d .ds{color:var(--mut);font-size:11.5px;z-index:2;line-height:1.4}
.btn4d:hover{cursor:pointer}
.no-results{display:none;text-align:center;color:var(--mut);padding:40px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(3,4,10,.85);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.overlay.open{display:flex}
.modal{width:100%;max-width:760px;background:linear-gradient(170deg,#0d1020,#0a0c1c);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.m-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.m-head .m-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,rgba(0,245,255,.16),rgba(168,85,247,.16));border:1px solid var(--border)}
.m-head h2{font-size:21px;font-weight:800}
.m-close{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--txt);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
.m-body{display:flex;flex-direction:column;gap:14px}
.m-body label{font-size:13px;color:var(--mut);font-weight:600}
.m-body textarea,.m-body input[type=text],.m-body input[type=number],.m-body select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#0b0d1a;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.m-body textarea{min-height:110px;resize:vertical;font-family:monospace;font-size:13px}
.m-body textarea:focus,.m-body input:focus,.m-body select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,255,.12)}
.m-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn{display:inline-block;padding:11px 20px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:14px;color:#05060f;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--border)}
.out{background:#05060f;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;min-height:44px;color:#cfd3ff}
.out.small{min-height:auto;font-size:14px}
.help{color:var(--mut);font-size:12.5px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:14px}
.kv b{color:var(--txt)}
.kv span{color:var(--mut);word-break:break-all;text-align:right}
.badge-pill{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.25);color:var(--cyan);font-size:12px;margin-right:6px;margin-bottom:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;z-index:400;background:#0d1020;border:1px solid rgba(0,245,255,.4);color:var(--txt);padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;transition:.3s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--cyan)}
@media(max-width:640px){.hero{padding:44px 6vw 24px}}
</style>

<script>
/* ============ SOUND + 4D ============ */
var actx=null,soundOn=true;
function ctx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
function beep(f,d,t,v,dl){if(!soundOn)return;try{var c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;var x=c.currentTime+(dl||0);g.gain.setValueAtTime(.0001,x);g.gain.exponentialRampToValueAtTime(v||.2,x+.01);g.gain.exponentialRampToValueAtTime(.0001,x+(d||.2));o.connect(g);g.connect(c.destination);o.start(x);o.stop(x+(d||.2)+.02)}catch(e){}}
function snd(k){if(k==='h')beep(660,.05,'triangle',.06);else if(k==='c'){beep(520,.08,'square',.12);beep(780,.06,'triangle',.1,.02)}else if(k==='s'){beep(523,.12,'sine',.15);beep(659,.12,'sine',.15,.09);beep(784,.2,'sine',.16,.18)}else if(k==='e'){beep(300,.25,'sawtooth',.12)}}
document.getElementById('soundToggle').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)snd('c');ctx()});
document.addEventListener('mousemove',function(e){if(e.target.classList.contains('btn4d')){var r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;e.target.style.transform='perspective(900px) rotateX('+(0.5-y)*16+'deg) rotateY('+(x-0.5)*16+'deg) translateZ(5px)';e.target.style.setProperty('--mx',x*100+'%');e.target.style.setProperty('--my',y*100+'%')}});
document.addEventListener('mouseleave',function(e){if(e.target.classList.contains('btn4d'))e.target.style.transform=''});
document.addEventListener('mouseover',function(e){if(e.target.classList.contains('btn4d'))snd('h')});

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2000)}
function copyEl(el){var t=el.innerText||el.value||'';navigator.clipboard.writeText(t).then(function(){toast('📋 Copied to clipboard');snd('s')},function(){toast('Copy failed');snd('e')})}

/* ============ MODAL HELPERS ============ */
function openTool(html,title,icon,init){
  var ov=document.getElementById('overlay'),m=document.getElementById('modal');
  m.innerHTML='<div class="m-head"><div class="m-ico">'+icon+'</div><h2>'+title+'</h2><button class="m-close" onclick="closeModal()">✕</button></div><div class="m-body">'+html+'</div>';
  ov.classList.add('open');document.body.style.overflow='hidden';
  if(init)setTimeout(init,30);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

/* ============ TOOL DATA ============ */
var tools=[
{g:'Text',i:'🔠',n:'Case Converter',d:'UPPER, lower, Title, sentence'},
{g:'Text',i:'🔢',n:'Word & Character Counter',d:'Words, lines, characters, read time'},

var glowPalette=['cyan','violet','pink','green'];
function render(filter){
  var grid=document.getElementById('grid'),q=(filter||'').toLowerCase().trim();
  var list=tools.filter(function(t){if(!q)return true;return (t.n+' '+t.d+' '+t.g).toLowerCase().indexOf(q)!==-1});
  grid.innerHTML='';
  if(!list.length){document.getElementById('noResults').style.display='block';return}
  document.getElementById('noResults').style.display='none';
  list.forEach(function(t,idx){
    var a=document.createElement('a');a.className='btn4d';a.href='#';a.setAttribute('data-glow',glowPalette[idx%4]);
    a.innerHTML='<div class="ti">'+t.i+'</div><div class="nm">'+t.n+'</div><div class="ds">'+t.d+'</div>';
    a.addEventListener('click',function(e){e.preventDefault();snd('c');openToolById(t.n)});
    grid.appendChild(a);
  });
}
document.getElementById('search').addEventListener('input',function(){render(this.value)});
render('');

/* ---- Text: Case Converter ---- */
function caseCase(pre){
  openTool(pre+
    '<label>Your text</label><textarea id="t1"></textarea>'+
    '<div class="m-row">'+
      '<button class="btn" onclick="cApply(\'up\')">UPPERCASE</button>'+
      '<button class="btn" onclick="cApply(\'low\')">lowercase</button>'+
      '<button class="btn" onclick="cApply(\'tit\')">Title Case</button>'+
      '<button class="btn" onclick="cApply(\'sen\')">Sentence case</button>'+
    '</div><label>Result</label><div class="out" id="o1"></div>'+
    '<button class="btn ghost" onclick="copyEl(document.getElementById(\'o1\'))">📋 Copy result</button>',
    'Case Converter','🔠');
  window.cApply=function(m){var t=document.getElementById('t1').value;if(!t){snd('e');return}var r;
    if(m==='up')r=t.toUpperCase();
    else if(m==='low')r=t.toLowerCase();
    else if(m==='tit')r=t.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()});
    else if(m==='sen')r=t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,function(c){return c.toUpperCase()});
    document.getElementById('o1').textContent=r;snd('s')};
}
/* ---- Text: Word counter ---- */
function wordCount(pre){
  openTool(pre+'<label>Your text</label><textarea id="t1" oninput="wc()"></textarea><div class="out small" id="o1"></div>',
  'Word & Character Counter','🔢');
  window.wc=function(){var t=document.getElementById('t1').value,words=t.trim()?(t.trim().split(/\s+/).length):0,lines=t.split('\n').filter(function(l){return l.trim()!==''}).length,chars=t.length,noSp=t.replace(/\s/g,'').length,wordsPerMin=Math.max(1,Math.round(words/200));document.getElementById('o1').innerHTML='<span class="badge-pill">Words: <b>'+words+'</b></span><span class="badge-pill">Chars: '+chars+'</span><span class="badge-pill">Chars (no space): '+noSp+'</span><span class="badge-pill">Lines: '+lines+'</span><span class="badge-pill">Read time: ~'+wordsPerMin+' min</span>'};
}
/* ---- Text: Lorem Ipsum ---- */
function lorem(pre){

  window.seoNow=function(){var html=document.getElementById('t2').value;var finish=function(h){var score=0,notes=[],tests=[];if(/<title[^>]*>[\s\S]*?<\/title>/i.test(h)){score+=15;tests.push(['✅','Title tag present',15])}else{notes.push('Missing <title>')}if(/<meta[^>]+name=["\']?description/i.test(h)){score+=15;tests.push(['✅','Meta description',15])}else{notes.push('Missing meta description')}if(/<h1/i.test(h)){score+=15;tests.push(['✅','H1 heading',15])}else{notes.push('Missing H1')}var imgs=(h.match(/<img/gi)||[]).length,alts=(h.match(/alt=/gi)||[]).length;score+=Math.min(10,imgs?Math.round(10*alts/imgs):10);tests.push(['✅','Alt text: '+alts+'/'+imgs,Math.min(10,imgs?Math.round(10*alts/imgs):10)]);if(/<html[^>]+lang=/i.test(h)){score+=10;tests.push(['✅','HTML lang attribute',10])}else{notes.push('No lang attribute')}if(/<meta[^>]+(viewport|robots|canonical)/i.test(h)){score+=10;tests.push(['✅','Meta (viewport/robots/canonical)',10])}else{notes.push('No viewport/robots/canonical meta')}if(h.length>2000){score+=10;tests.push(['✅','Substantial content',10])}if(/<a[^>]+href=["\']https?:\/\//i.test(h)){score+=10;tests.push(['✅','External links found',10])}else{notes.push('No external links')}score=Math.min(100,score);var htmlOut='<div style="text-align:center;padding:10px"><span style="font-size:40px;font-weight:900">'+score+'<span style="font-size:18px">/100</span></span></div>';htmlOut+=tests.map(function(t){return '<div class="kv"><b>'+t[0]+' '+t[1]+'</b><span>+'+t[2]+'</span></div>'}).join('');if(notes.length)htmlOut+='<div class="help" style="margin-top:8px">Suggestions: '+notes.join('; ')+'</div>';document.getElementById('o1').innerHTML=htmlOut;snd('s')};if(html){finish(html)}else{var u=document.getElementById('t1').value;if(!u){snd('e');document.getElementById('o1').innerHTML='<div class="help">Enter a URL or paste HTML</div>';return}document.getElementById('o1').innerHTML='<div class="help">Fetching (may fail due to CORS)...</div>';fetch(u).then(function(r){return r.text()}).then(finish).catch(function(){document.getElementById('o1').innerHTML='<div class="help">⚠ Could not fetch (CORS). Paste the page source into the textarea instead.</div>';snd('e')})}};
}
